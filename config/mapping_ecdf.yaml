# =====================================================================
# MAPPING ANNEXES -> CASES DE LA DECLARATION TVA (eCDF)
# Un profil par formulaire. Le moteur choisit selon le type de periode.
# =====================================================================
formulaires:

  # -------------------------------------------------------------------
  TVA_DECA_2025:
    libelle: "Declaration annuelle - TVA_DECA"
    version_source: "2025M1V002"
    periodes: ["ANNUAL"]
    statut: VALIDE
    source: >
      Formulaire officiel eCDF TVA_DECA, version 2025M1V002, edition anglaise
      "VALUE ADDED TAX - Return for year 2025", lu directement le 02/09/2026.
      Numeros releves sur les sections I a IV du formulaire.

    # --- I. Assiette du chiffre d'affaires --------------------------
    turnover:
      ca_global: {base: "012", libelle: "Total sales / receipts (overall turnover)"}
      total_exonerations: {base: "021", libelle: "Exemptions and deductible amounts"}
      ca_taxable: {base: "022", libelle: "Taxable turnover (012-021)"}
      livraisons_intracom: {base: "013", libelle: "Intra-Community supply of goods"}
      exportations: {base: "014", libelle: "Exports (Art. 43(1)(a) and (b))"}
      exonerations_art43: {base: "015", libelle: "Other exemptions (Art. 43 and 60bis)"}
      exonerations_art44: {base: "016", libelle: "Other exemptions (Art. 44 and 56quater)"}
      services_ue_rendus: {base: "423", libelle: "Services to EU customers liable for VAT"}
      operations_lieu_etranger: {base: "019", libelle: "Other supplies with place of supply abroad"}

    # --- II. Taxe due (aval) ----------------------------------------
    aval:
      ventes_lu_total: {base: "037", taxe: "046", libelle: "Breakdown of taxable turnover - total"}
      ventes_lu_17: {base: "701", taxe: "702", libelle: "Taxable turnover at 17%"}
      ventes_lu_14: {base: "703", taxe: "704", libelle: "Taxable turnover at 14%"}
      ventes_lu_08: {base: "705", taxe: "706", libelle: "Taxable turnover at 8%"}
      ventes_lu_03: {base: "031", taxe: "040", libelle: "Taxable turnover at 3%"}

    autoliquidation:
      acq_intracom_total: {base: "051", taxe: "056", libelle: "Intra-Community acquisitions of goods - total"}
      acq_intracom_17: {base: "711", taxe: "712", libelle: "Intra-Community acquisitions at 17%"}
      importations_total: {base: "065", taxe: "407", libelle: "Importation of goods - total"}
      importations_17: {base: "721", taxe: "722", libelle: "Importation of goods at 17%"}
      services_recus_total: {base: "409", taxe: "410", libelle: "Services received - customer liable, total"}
      services_recus_ue_total: {base: "436", taxe: "462", libelle: "Services received from EU suppliers"}
      services_ue_17: {base: "741", taxe: "742", libelle: "Services received from EU suppliers at 17%"}
      services_recus_tiers_total: {base: "463", taxe: "464", libelle: "Services received from non-EU suppliers"}
      services_tiers_17: {base: "751", taxe: "752", libelle: "Services received from non-EU suppliers at 17%"}

    # --- III. Taxe deductible (amont) -------------------------------
    amont:
      tva_amont_totale: {taxe: "093", libelle: "Total input tax"}
      tva_amont_non_deductible: {taxe: "097", libelle: "Total input tax non-deductible"}
      prorata_non_recuperable: {taxe: "095", libelle: "Non recoverable proportion (Art. 50)"}
      tva_amont_deductible: {taxe: "102", libelle: "Total input tax deductible (093-097+101)"}

      # --- Ventilation de la taxe en amont par nature de depense -------
      #
      # Releve sur le formulaire officiel TVA_DECA 2025 (pages 5 et 6),
      # section III.A. Le formulaire croise DEUX axes :
      #   - la nature de la depense : stock (080) / investissement (084) /
      #     frais d'exploitation (088), plus "autres" (179) ;
      #   - l'origine de la taxe : facturee par un assujetti (a), acquisition
      #     intracommunautaire (b), importation (c), autoliquidation (d).
      #
      # Le moteur connait le second axe -- il decoule du regime de chaque
      # facture -- mais PAS le premier : rien dans une facture ne dit si un
      # achat est un stock, un investissement ou un frais d'exploitation.
      # C'est une qualification comptable, propre au dossier.
      #
      # Ces postes n'ont donc aucun equivalent cote moteur : ils restent
      # vides dans la replique PDF (le client voit la case et voit qu'elle
      # n'est pas remplie) et sont omis du XML (eCDF interdit les elements
      # vides et distingue un 0 declare d'une case absente). Les remplir
      # suppose une ventilation cote moteur, a valider separement.
      stock_total: {taxe: "080", libelle: "Total of VAT on stock entries"}
      stock_assujettis: {taxe: "077", libelle: "Stock - VAT invoiced by other taxable persons"}
      stock_acq_intracom: {taxe: "078", libelle: "Stock - VAT on intra-Community acquisitions"}
      stock_importations: {taxe: "079", libelle: "Stock - VAT on importations"}
      stock_autoliquidation: {taxe: "404", libelle: "Stock - VAT due under the reverse charge"}

      invest_total: {taxe: "084", libelle: "Total of VAT on capital expenditures"}
      invest_assujettis: {taxe: "081", libelle: "Capital expenditure - VAT invoiced by other taxable persons"}
      invest_acq_intracom: {taxe: "082", libelle: "Capital expenditure - VAT on intra-Community acquisitions"}
      invest_importations: {taxe: "083", libelle: "Capital expenditure - VAT on importations"}
      invest_autoliquidation: {taxe: "405", libelle: "Capital expenditure - VAT due under the reverse charge"}

      exploitation_total: {taxe: "088", libelle: "Total of VAT on operational expenditures"}
      exploitation_assujettis: {taxe: "085", libelle: "Operational expenditure - VAT invoiced by other taxable persons"}
      exploitation_acq_intracom: {taxe: "086", libelle: "Operational expenditure - VAT on intra-Community acquisitions"}
      exploitation_importations: {taxe: "087", libelle: "Operational expenditure - VAT on importations"}
      exploitation_autoliquidation: {taxe: "406", libelle: "Operational expenditure - VAT due under the reverse charge"}

      autres_total: {taxe: "179", libelle: "Other input tax - total"}
      autres_art13b: {taxe: "090", libelle: "Tax due on application of goods for business purposes (Art. 13(b))"}
      autres_garantie_art48: {taxe: "092", libelle: "Tax paid as joint and several guarantee (Art. 48)"}
      autres_suspension_art60bis: {taxe: "228", libelle: "Adjusted tax - tax suspension arrangement (Art. 60bis(9))"}

      # --- Detail de la taxe non deductible (case 097) ------------------
      non_deductible_art44: {taxe: "094", libelle: "Non recoverable input tax - exempt supplies (Art. 44, 56quater, 57bis/ter/quater)"}
      non_deductible_marge: {taxe: "096", libelle: "Non recoverable input tax - margin scheme (Art. 56ter-1(7), 56ter-2(7))"}

      # --- Regularisations des deductions (case 101) --------------------
      # Une diminution de la taxe recuperable se note avec un signe moins.
      regul_total: {taxe: "101", libelle: "Adjustment of deductions"}
      regul_art53: {taxe: "098", libelle: "Adjustment of deductions - Art. 53"}
      regul_option_terrains: {taxe: "099", libelle: "Adjustment of deductions - option to tax land (Rgt g.-d. 07.03.1980)"}
      regul_autres: {taxe: "100", libelle: "Adjustment of deductions - other"}

    # --- IV. Solde ---------------------------------------------------
    solde:
      total_taxe_due: {taxe: "076", libelle: "Total tax due (046+056+407+410+768+227)"}
      total_aval: {taxe: "103", libelle: "Total tax due (carried forward from II.H)"}
      total_amont_deductible: {taxe: "104", libelle: "Total input tax deductible (from III.D)"}
      excedent: {taxe: "105", libelle: "Exceeding amount (103-104)"}

    # --- Regime d'exigibilite declare sur le formulaire --------------
    exigibilite:
      debits: {case: "204", libelle: "VAT accounting scheme: on sales"}
      encaissements: {case: "205", libelle: "VAT accounting scheme: on payments received"}

  # -------------------------------------------------------------------
  TVA_DECM_2025:
