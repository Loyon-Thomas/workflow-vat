      tva_amont_facturee: {taxe: "458", libelle: "Invoiced by other taxable persons (Art. 48(1)(a))"}
      tva_amont_acq_intracom: {taxe: "459", libelle: "Due on intra-Community acquisitions (Art. 48(1)(b))"}
      tva_amont_importations: {taxe: "460", libelle: "Due or paid on importation (Art. 48(1)(c))"}
      tva_amont_reverse_charge: {taxe: "461", libelle: "Due under the reverse charge (points II.E and F)"}
      tva_amont_non_deductible: {taxe: "097", libelle: "Total input tax non-deductible"}
      exonerations_non_deductible: {taxe: "094", libelle: "Non-deductible - exempt transactions (Art. 44 etc.)"}
      prorata_non_recuperable: {taxe: "095", libelle: "Non-deductible proportion (Art. 50)"}
      tva_amont_deductible: {taxe: "102", libelle: "Total input tax deductible (093-097)"}

    solde:
      total_taxe_due: {taxe: "076", libelle: "Total tax due (046+056+407+410+768+227)"}
